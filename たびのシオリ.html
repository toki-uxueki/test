<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しおり</title>
<style>
:root{
  --primary:#F3836A; --primary-dark:#CF6250; --primary-soft:#FCE9E4; --on-primary:#FFFFFF;
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#17302E; --muted:#6E8582; --line:#DCEBE8;
  --surface:#FFFFFF; --sub-bg:#F5FBFA; --gray-btn:#EEF1F6; --hero1:#2A4E9E; --hero2:#3A66C9; --hero3:#6A93E0; --page:#EAF5F3; --overlay:rgba(20,32,56,.4);
  --danger:#D9434F; --ok:#4F6A9A;
}
.theme-wrap{display:flex;align-items:center;gap:10px}
.header-hero .add-btn{position:absolute;right:20px;top:50%;transform:translateY(-50%)}
.add-btn::before,.add-btn::after{content:'';position:absolute;left:50%;top:50%;background:var(--primary);border-radius:2px;transform:translate(-50%,-50%)}
.add-btn::before{width:18px;height:3px}
.add-btn::after{width:3px;height:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.6;background:var(--page);
  display:flex;justify-content:center;
}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
img{display:block}

/* header */
.header{background:var(--primary);color:#FFFFFF;padding:20px 20px 18px;display:flex;align-items:center;gap:12px;min-height:64px}
.header h1{font-size:18px;font-weight:700;flex:1}
.header .eyebrow{font-size:12px;opacity:.8;letter-spacing:.06em}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#FFFFFF;flex-shrink:0}
.icon-btn:active{background:rgba(255,255,255,.15)}
.header-hero{padding:24px 20px 20px;border-radius:0 0 24px 24px;display:flex;align-items:center;justify-content:center;position:relative;text-align:center;background:var(--primary);color:#FFFFFF;text-shadow:none}
.header-hero h1{font-size:22px;font-weight:700}
.header-hero .eyebrow{font-size:12px;opacity:.8;letter-spacing:.08em;margin-bottom:2px}
.add-btn{background:var(--surface);color:var(--primary);width:44px;height:44px;border-radius:50%;font-size:0;position:relative;display:flex;align-items:center;justify-content:center}

.pad{padding:16px 16px 40px}
.pb{padding-bottom:110px}
.empty{text-align:center;color:var(--muted);padding:40px 10px;line-height:1.9}

/* trip cards */
.tcard{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px;cursor:pointer;border:1px solid var(--line)}
.tcard:active{background:var(--sub-bg)}
.tcard-img{position:relative;height:140px}
.tcard-body{padding:12px 16px 16px}
.tcard-body h3{font-size:17px;font-weight:700;margin-bottom:2px}
.date{color:var(--muted);font-size:13px}
.avatars{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.av{padding:4px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font-weight:700;font-size:12px;white-space:nowrap}

.pill{position:absolute;top:10px;right:10px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#fff;color:var(--primary-dark);transform:rotate(-4deg);box-shadow:0 2px 0 rgba(47,111,222,.25)}
.pill.now{background:var(--primary);color:var(--on-primary)}
.pill.past{background:#8A96A8;color:#fff}
.cal-badge{position:absolute;top:12px;right:12px;width:78px;background:var(--surface);border-radius:10px;box-shadow:0 4px 10px rgba(20,32,56,.18);text-align:center;color:var(--ink);z-index:2}
.cb-top{position:relative;height:20px;background:var(--primary);border-radius:10px 10px 0 0}
.cb-top::before,.cb-top::after{content:'';position:absolute;top:-8px;width:6px;height:14px;border:3px solid #8A96A8;border-radius:4px;background:var(--surface)}
.cb-top::before{left:16px}
.cb-top::after{right:16px}
.cb-body{position:relative;padding:4px 0 10px}
.cb-body small{display:block;font-size:10px;font-weight:700;color:var(--primary-dark);line-height:1.2}
.cb-body b{display:block;font-size:32px;font-weight:900;line-height:1.05}
.cb-body span{font-size:11px;font-weight:700}
.cb-body .txt{display:block;font-size:14px;padding-top:8px;line-height:1.3}
.cb-body::after{content:'';position:absolute;left:0;bottom:0;width:14px;height:14px;background:none;border-radius:0 0 0 10px}
.cal-badge.past .cb-top{background:#9AA5B4}
.cal-badge.past .cb-body .txt{color:#8A96A8}
.cal-badge.now .cb-top{background:var(--primary-dark)}

.thumb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--primary-soft);color:var(--primary);font-size:34px;font-weight:700}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.sm{width:64px;height:64px;flex-shrink:0;border-radius:10px;font-size:22px}

.btn-block{width:100%;padding:14px 24px;border-radius:999px;font-weight:700;font-size:15px;margin-top:8px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:active{background:var(--primary-dark)}
.btn-outline{background:var(--surface);color:var(--ink);border:1px solid var(--primary)}
.btn-ghost{background:var(--gray-btn);color:var(--ink);margin-top:10px}
.btn-past{display:block;margin:12px auto 0;padding:7px 16px;border-radius:999px;background:var(--gray-btn);color:var(--muted);font-size:12px;font-weight:700}
.btn-danger{background:none;color:var(--danger);border:1px solid var(--danger);margin-top:10px}

/* trip detail */
.trip-head{background:var(--primary);color:#FFFFFF;padding:14px 16px 20px}
.trip-head .top{display:flex;align-items:center;gap:8px}
.trip-head h1{font-size:19px;font-weight:700;line-height:1.3}
.trip-head p{margin-top:6px;font-size:13px;opacity:.9;padding-left:48px}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs button{flex:1;padding:14px 0;color:var(--muted);font-weight:700;font-size:14px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--primary)}

.day{margin-bottom:16px;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.dayhead{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-weight:700;font-size:15px;padding:12px 16px;background:none;border-bottom:1px solid var(--line);color:var(--ink)}
.dbadge{justify-self:start;background:var(--primary);color:var(--on-primary);padding:2px 10px;border-radius:6px;font-size:13px}
.none{color:var(--muted);font-size:13px;padding:14px 16px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--card);padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.item:active{background:var(--sub-bg)}
.tcol{width:78px;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-start;padding-top:1px}
.t1{font-size:17px;font-weight:700;color:var(--primary-dark);line-height:1.2}
.t1.muted{color:#B5C0CC}
.t2{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.item:nth-child(3n+1){border-left-color:#FF6FA3}
.item:nth-child(3n+2){border-left-color:#FFC93C}
.item:nth-child(3n){border-left-color:#2BA36E}
.ibody{flex:1;min-width:0}
.ibody b{font-size:15px;font-weight:700;word-break:break-all}
.ibody small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;word-break:break-all}
.memo{padding:0;font-size:13px;margin-top:6px;white-space:pre-wrap;color:var(--ink)}
.ic{position:relative;display:block;margin:0;padding:0}
.ic svg{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:18px;height:18px;display:block;color:var(--primary-dark);margin:0}
.ibody small.ic{display:block;font-size:14px;color:var(--ink);margin-top:4px}
.memo.ic svg{top:3px;transform:none}
.ibody small.ic svg{margin-top:0}
.costtag{display:inline-block;margin-top:6px;flex-shrink:0;white-space:nowrap;color:var(--primary-dark);font-weight:700;padding:2px 0;border-radius:6px;font-size:12.5px}
.titlerow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.titlerow b{min-width:0}
.titlerow .thumb.sm{width:52px;height:52px;border-radius:8px;font-size:18px}
.ico{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.ico svg{width:18px;height:18px}
.iconpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ipick{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center}
.ipick svg{width:20px;height:20px}
.ipick.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -20px 14px;padding:14px 20px 10px;background:var(--surface);position:sticky;top:-10px;z-index:2;border-radius:24px 24px 0 0}
.sh-head h2{margin:0}
.sh-save{background:var(--primary);color:var(--on-primary);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;flex-shrink:0}

.fab{position:fixed;bottom:22px;right:max(16px,calc(50% - 199px));z-index:20;background:var(--primary);color:var(--on-primary);padding:14px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(47,111,222,.3)}
.fab:active{background:var(--primary-dark)}

/* warikan */
.total{display:flex;align-items:baseline;gap:10px;width:max-content;margin:0 16px 14px auto;border-bottom:1px solid #C5CED8;padding:14px 0 4px;font-weight:700}
.total span{font-size:12px;color:var(--muted);font-weight:700}
.total b{font-size:21px;color:var(--ink)}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.wcard:active{background:var(--sub-bg)}
.wtop{display:flex;justify-content:space-between;align-items:center}
.wdate{color:var(--muted);font-size:13px;font-weight:700}
.wamt{font-size:18px;font-weight:700;color:var(--ink)}
.wtitle{font-weight:700;font-size:15px;margin:6px 0 4px}
.wmeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:12.5px;color:var(--muted)}
.wnames{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nm{background:var(--primary-soft);color:var(--primary-dark);padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}

/* sheet */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;justify-content:center;align-items:flex-end;animation:fade .2s ease}
.sheet{width:100%;max-width:430px;max-height:75vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(28px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
.grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:18px;font-weight:700;margin-bottom:14px}
.sheet h3{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--muted)}
.sub2{color:var(--muted);font-size:13px;margin:-8px 0 6px}
.bigamt{font-size:30px;font-weight:700;color:var(--ink);text-align:center;margin:8px 0 14px}
.info{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.info b{font-weight:700}
.dt-head h2{margin-bottom:4px}
.dt-date{font-size:16px;color:var(--muted);font-weight:700;margin-bottom:12px}
.dt-times{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dt-box{flex:1;border:none;border-radius:12px;padding:10px 12px;background:var(--surface)}
.dt-box small{display:block;font-size:12px;color:var(--muted);font-weight:700}
.dt-box b{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.dt-sub{display:block;font-size:13px;color:var(--ink);font-weight:700;margin-top:2px}
.dt-arrow{font-size:14px;color:var(--muted);text-align:center;min-width:24px}
.dt-row{background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.dt-row small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
.dt-row .val{font-size:15px;white-space:pre-wrap;word-break:break-all}
.dt-row .unset{font-size:15px;color:#B5C0CC}
.dt-thumb{width:100%;height:150px;border-radius:10px;overflow:hidden;margin-top:4px}
.dt-row a{display:block;font-size:15px;color:var(--primary);text-decoration:underline;white-space:pre-wrap;word-break:break-all}
.dt-map{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--primary)}
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.pills+.pills{margin-top:6px}
.pill-lbl{font-size:12px;color:var(--muted);font-weight:700;margin-right:4px;min-width:40px}
.pm{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font-size:13px;font-weight:700}
.pm.payer{background:var(--primary);color:var(--on-primary)}
.settle-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.settle-row b{margin-left:auto;font-size:16px;color:var(--ink)}
.sarrow{color:var(--muted);font-weight:700}
.sat{color:#2F6FDE}
.hol{color:#D9434F}
.dt-thumb img{width:100%;height:100%;object-fit:cover}
.overlay.full{align-items:stretch;justify-content:center;background:var(--page);padding:0}
.fullpage{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;background:var(--page)}
.fp-body{flex:1;overflow-y:auto;padding:16px 16px 20px}
.fp-body h2{font-size:18px;font-weight:700;margin-bottom:4px}
.fp-foot{padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.fp-foot .btn-block{margin-top:0}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-weight:700;font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea,.prow input,.addrow input{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink);outline:none
}
.field input:focus,.field select:focus,.field textarea:focus,.prow input:focus,.addrow input:focus{border-color:var(--primary)}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.date-btn{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink);text-align:left;font-weight:700}
.date-btn.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.cal{border:1px solid var(--line);border-radius:14px;padding:12px;margin:-4px 0 14px;background:var(--surface)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px}
.cal-nav{width:32px;height:32px;border-radius:50%;background:var(--gray-btn);font-size:18px;color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-wd{font-size:11px;color:var(--muted);padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:50%;font-size:14px;color:var(--ink);background:none;font-weight:500}
.cal-day.today{color:var(--ink);font-weight:700}
.cal-day.in{background:var(--primary-soft);border-radius:0}
.cal-day.start,.cal-day.end{background:var(--primary);color:var(--on-primary);font-weight:700}
.overlay.cal-layer{align-items:center;padding:20px}
.cal-pop{width:100%;max-width:360px;background:var(--surface);border-radius:20px;padding:16px;box-shadow:0 20px 40px rgba(20,32,56,.25)}
.cal-pop .cal{border:none;margin:0;padding:0}
.cal-pop .btn-block{margin-top:12px}
.cal-layer:not(.static) .cal-pop{animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}

.thumb-pick{display:flex;align-items:center;justify-content:center;height:130px;border-radius:10px;border:1px dashed var(--line);background:var(--sub-bg);overflow:hidden;cursor:pointer;color:var(--primary);font-weight:700;font-size:14px}
.thumb-pick img{width:100%;height:100%;object-fit:cover}
.thumb-pick.sm{height:110px}

.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.chip-btn{background:var(--primary);color:var(--on-primary);border-radius:999px;padding:0 18px;font-weight:700;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips small{color:var(--muted)}
.chip{background:var(--primary-soft);color:var(--primary-dark);padding:4px 6px 4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.chip b{cursor:pointer;padding:0 6px;font-size:15px}

.costbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--sub-bg)}
.switch-row{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:10px;font-size:14px}
.switch-row input{width:20px;height:20px;accent-color:var(--primary);flex-shrink:0}
.switch-row.small{font-size:13px;margin:4px 0 10px;font-weight:700}
.hint{color:var(--muted);font-size:12px;margin-bottom:10px}
.prow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.prow span{width:96px;font-weight:700;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.prow input{text-align:right;padding:8px 10px}
.prow.view{justify-content:space-between}
.prow.view span{width:auto}
.sumrow{text-align:right;color:var(--muted);margin-top:4px;font-size:13px}
.sumrow b{color:var(--ink);font-size:15px}
.tlist{display:flex;flex-wrap:wrap;gap:8px}
.tgl{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;color:var(--muted);font-size:13px}
.tgl.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 0;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--on-primary)}
.err{color:var(--danger);font-weight:700;font-size:13px;min-height:1.2em;margin-bottom:6px}

@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay.static,.overlay.static .sheet{animation:none}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}

.fab{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.sh-head{justify-content:center}
.sh-head h2{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.trip-head .top{position:relative;display:block;text-align:center;min-height:34px}
.trip-head .top h1{font-size:19px;padding:6px 40px 0}
.trip-head .top .icon-btn{position:absolute;left:0;top:0;width:34px;height:34px;border:1.5px solid #FFFFFF;border-radius:50%;background:transparent;color:#FFFFFF;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.trip-head p{padding-left:0;text-align:center}
.trip-head .top .icon-btn{font-weight:900;font-size:22px;-webkit-text-stroke:0.8px #FFFFFF}
.trip-head .top .icon-btn{border:none;background:none;width:34px;height:34px;font-size:0;-webkit-text-stroke:0;padding:0}
.trip-head .top{min-height:44px}
.trip-head .top .icon-btn{width:44px;height:44px;top:4px}
.trip-head .top .icon-btn svg{width:30px;height:30px}
.trip-head .top .icon-btn{top:10px}
.fullpage .header .icon-btn{width:44px;height:44px}
.fullpage .header .icon-btn svg{width:28px;height:28px}
.trip-head{height:116px;box-sizing:border-box}
.fullpage .header{height:116px;box-sizing:border-box;padding:0 16px}
.trip-head{height:92px;padding-bottom:0;box-sizing:border-box}
.fullpage .header{height:92px;box-sizing:border-box}
@keyframes tripIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#app.enter{animation:tripIn .4s ease-out}
.icon-btn,.btn-block,.add-btn,.tcard{transition:transform .12s ease}
.icon-btn:active,.btn-block:active{transform:scale(.9)}

<div id="app"></div>
<div id="modal-root"></div>

<script>
const KEY = 'shiori-app-v1';
const WD = ['日','月','火','水','木','金','土'];
const MEMBER_COLORS = ['#2F6FDE','#1E4FB0','#4C8BF5','#5B7FBF','#3A6EA5','#7A9CD6'];
const PALETTE = ['#12998A','#1BAFC4','#3FB8AC','#0E7F74','#2FA9C0'];

const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥' + Number(n || 0).toLocaleString('ja-JP');
const pad = n => String(n).padStart(2, '0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtD = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const fmtRange = (a,b) => { const d = parse(a); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} 〜 ${fmtD(b)}`; };
const todayStr = () => toStr(new Date());
const diffDays = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
function dateRange(a,b){
  const out = []; const n = diffDays(a,b);
  for (let i = 0; i <= n; i++){ const d = parse(a); d.setDate(d.getDate()+i); out.push(toStr(d)); }
  return out;
}
const thumb = (src, title, cls='') => src
  ? `<div class="thumb ${cls}"><img src="${src}" alt=""></div>`
  : `<div class="thumb ${cls}" style="background:var(--primary);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.15)">${esc((title||'').slice(0,1)) || '旅'}</div>`;

function tripStatus(t){
  const today = todayStr();
  if (t.end < today) return { kind:'past' };
  if (t.start > today) return { kind:'up', days: diffDays(today, t.start) };
  return { kind:'now' };
}
const mname = (t, id) => (t.members.find(m => m.id === id) || {}).name || '不明';
const currentTrip = () => db.trips.find(t => t.id === ui.tripId);

/* 負担額：均等割り（端数は先頭から1円ずつ）／こだわりは入力値そのまま */
function shares(cost){
  if (!cost) return {};
  if (cost.mode === 'custom'){
    const r = {};
    for (const [k,v] of Object.entries(cost.custom || {})) if (Number(v) > 0) r[k] = Number(v);
    return r;
  }
  const ts = cost.targets || [];
  if (!ts.length) return {};
  const base = Math.floor(cost.amount / ts.length);
  let rem = cost.amount - base * ts.length;
  const r = {};
  ts.forEach(id => { r[id] = base + (rem > 0 ? 1 : 0); if (rem > 0) rem--; });
  return r;
}
const sumCustom = () => Object.values(ui.draft?.custom || {}).reduce((s,v) => s + (Number(v) || 0), 0);

function loadDb(){
  try {
    const s = localStorage.getItem(KEY);
    if (s){
      const d = JSON.parse(s);
      d.trips = d.trips.map(t => (t.id === 't2' && t.title === '箱根 温泉旅行') ? seed().trips[1] : t);
      if (!d.trips.some(t => t.id === 't3')) d.trips.push(seed().trips[2]);
      d.trips = d.trips.map(t => (t.id === 't3' && !t.members.length) ? { ...t, members: seed().trips[2].members } : t);
      d.trips = d.trips.map(t => (t.id === 't3' && !t.items.length) ? { ...t, items: seed().trips[2].items } : t);
      return d;
    }
  } catch(e){}
  return seed();
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 640 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = r.result;
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function tripCard(t){
  const s = tripStatus(t);
  const badge = s.kind === 'up' ? `あと${s.days}日` : s.kind === 'now' ? '旅行中' : '終了';
  return `
  <article class="tcard" data-action="open-trip" data-id="${t.id}" data-from="${ui.view}">
    <div class="tcard-img">
      ${thumb(t.thumb, t.title)}
      <div class="cal-badge ${s.kind}"><div class="cb-top"></div><div class="cb-body">${s.kind === 'up' ? `<small>あと</small><b>${s.days}</b><span>日</span>` : `<b class="txt">${s.kind === 'now' ? '旅行中' : '終了'}</b>`}</div></div>
    </div>
    <div class="tcard-body">
      <h3>${esc(t.title)}</h3>
      <p class="date">${fmtRange(t.start, t.end)}</p>
      <div class="avatars">
        ${t.members.map(m => `<span class="av">${esc(m.name)}</span>`).join('')}
      </div>
    </div>
  </article>`;
}

function settlements(t){
  const bal = {};
  t.members.forEach(m => { bal[m.id] = 0; });
  t.items.forEach(x => {
    if (!x.cost) return;
    bal[x.cost.payerId] = (bal[x.cost.payerId] || 0) + x.cost.amount;
    Object.entries(shares(x.cost)).forEach(([id, v]) => { bal[id] = (bal[id] || 0) - v; });
  });
  const creditors = [], debtors = [];
  Object.entries(bal).forEach(([id, v]) => {
    v = Math.round(v);
    if (v > 0) creditors.push({ id, v });
    else if (v < 0) debtors.push({ id, v: -v });
  });
  const out = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length){
    const pay = Math.min(debtors[i].v, creditors[j].v);
    if (pay > 0) out.push({ from: debtors[i].id, to: creditors[j].id, amount: pay });
    debtors[i].v -= pay; creditors[j].v -= pay;
    if (debtors[i].v === 0) i++;
    if (creditors[j].v === 0) j++;
  }
  return out;
}

function openSchedule(item){
  const t = currentTrip();
  const d = {
    id:null, date:t.start, title:'', address:'', phone:'', memo:'', thumb:'', startTime:'', endTime:'', icon:'',
    hasCost:false, amount:'', payerId:t.members[0]?.id || '',
    targets:t.members.map(m => m.id), picky:false, custom:{}
  };
  if (item){
    Object.assign(d, { id:item.id, date:item.date, title:item.title, address:item.address, phone:item.phone, memo:item.memo, thumb:item.thumb, startTime:item.startTime || '', endTime:item.endTime || '', icon:item.icon || '', hasCost:!!item.cost });
    if (item.cost){
      d.amount = item.cost.amount; d.payerId = item.cost.payerId;
      d.targets = [...(item.cost.targets || [])];
      d.picky = item.cost.mode === 'custom';
      d.custom = { ...(item.cost.custom || {}) };
    }
  }
  ui.draft = d; ui.err = ''; ui.modal = { type:'schedule' };
  renderModal();
}

function togglePicky(on){
  const d = ui.draft;
  d.picky = on;
  if (on){
    const sh = shares({ amount:Number(d.amount)||0, mode:'even', targets:d.targets });
    d.custom = Object.fromEntries(Object.entries(sh).filter(([,v]) => v > 0));
  } else {
    const entries = Object.entries(d.custom).filter(([,v]) => Number(v) > 0);
    d.amount = entries.reduce((s,[,v]) => s + Number(v), 0) || '';
    d.targets = entries.map(([k]) => k);
  }
}

function fail(msg){
  ui.err = msg;
  renderModal();
}

function buildItem(d){
  const t = currentTrip();
  if (!d.title.trim()) return { err: 'タイトルを入力してください' };
  if (d.endTime && !d.startTime) return { err: '終了時間を入力する場合は開始時間も入力してください' };
  if (d.startTime && d.endTime && d.endTime < d.startTime) return { err: '終了時間は開始時間より後にしてください' };
  const item = {
    id: d.id || uid(), date: d.date, title: d.title.trim(),
    address: d.address.trim(), phone: d.phone.trim(), memo: d.memo.trim(), thumb: d.thumb || '',
    startTime: d.startTime || '', endTime: d.endTime || '', icon: d.icon || '', cost: null
  };
  if (d.hasCost){
    const payerId = d.payerId || t.members[0]?.id;
    if (!payerId) return { err: '先にメンバーを登録してください' };
    if (d.picky){
      const custom = {}; let sum = 0;
      for (const m of t.members){
        const v = Number(d.custom[m.id]);
        if (v > 0){ custom[m.id] = v; sum += v; }
      }
      if (!sum) return { err: '負担額を1人以上入力してください' };
      item.cost = { amount:sum, payerId, mode:'custom', targets:[], custom };
    } else {
      const amt = Number(d.amount);
      if (!(amt > 0)) return { err: '金額を入力してください' };
      if (!d.targets.length) return { err: '割り勘対象を選んでください' };
      item.cost = { amount:amt, payerId, mode:'even', targets:[...d.targets], custom:{} };
    }
  }
  return { item };
}

/* 入力内容が有効なら、変更のたびに自動で保存する（入力途中の不完全な内容は保存しない） */
function autoSave(){
  if (!ui.draft || ui.modal?.type !== 'schedule') return;
  const r = buildItem(ui.draft);
  if (r.err) return;
  const t = currentTrip();
  const idx = t.items.findIndex(x => x.id === r.item.id);
  if (idx >= 0) t.items[idx] = r.item; else t.items.push(r.item);
  ui.draft.id = r.item.id;
  save();
}

function saveSchedule(){
  const r = buildItem(ui.draft);
  if (r.err) return fail(r.err);
  autoSave();
  ui.modal = null; ui.draft = null; ui.tab = 'schedule';
  render();
}

function addMember(){
  const input = document.getElementById('newMember');
  const name = (input?.value || '').trim();
  if (!name) return;
  ui.tripDraft.members.push({ id:uid(), name });
  renderModal();
  document.getElementById('newMember')?.focus();
}

function saveTrip(){
  const d = ui.tripDraft;
  if (!d.title.trim()) return fail('タイトルを入力してください');
  if (!d.start || !d.end) return fail('日程を入力してください');
  if (d.end < d.start) return fail('帰着日は出発日より後にしてください');
  if (!d.members.length) return fail('メンバーを1人以上追加してください');
  db.trips.push({
    id:uid(), title:d.title.trim(), start:d.start, end:d.end, thumb:d.thumb || '',
    members:d.members.map(m => ({...m})), items:[]
  });
  save();
  ui.modal = null; ui.view = 'home'; ui.err = ''; ui.tripDraft = null;
  render();
}

const handlers = {
  'go-home': () => { ui.view = 'home'; ui.err = ''; render(); },
  'go-past': () => { ui.view = 'past'; render(); },
  'go-create': () => { ui.tripDraft = emptyTripDraft(); ui.err = ''; ui.cal = null; ui.modal = { type:'create' }; renderModal(); },
  'open-trip': el => {
    ui.tripId = el.dataset.id; ui.tab = 'schedule';
    ui.from = el.dataset.from === 'past' ? 'past' : 'home';
    ui.view = 'trip'; render(); window.scrollTo(0,0);
    const a = document.getElementById('app'); a.classList.remove('enter'); void a.offsetWidth; a.classList.add('enter');
  },
  'back': () => {
    ui.view = ui.from || 'home'; render(); window.scrollTo(0,0);
    const a = document.getElementById('app'); a.classList.remove('enter'); void a.offsetWidth; a.classList.add('enter');
  },
  'tab': el => { ui.tab = el.dataset.tab; render(); },
  'new-schedule': () => openSchedule(null),
  'edit-item': el => { ui.modal = { type:'detail', id: el.dataset.id }; renderModal(); },
  'open-cost': el => { ui.modal = { type:'cost', id: el.dataset.id }; renderModal(); },
  'edit-cost': el => {
    const it = currentTrip().items.find(x => x.id === el.dataset.id);
    if (it) openSchedule(it);
  },
  'close-modal': () => {
    const wasSchedule = ui.modal?.type === 'schedule';
    ui.modal = null; ui.draft = null;
    if (wasSchedule){ const y = window.scrollY; render(); window.scrollTo(0, y); }
    else renderModal();
  },
  'overlay': (el, e) => { if (e.target === el) handlers['close-modal'](); },
  'save-schedule': () => saveSchedule(),
  'delete-item': () => {
    const id = ui.draft?.id;
    if (!id || !confirm('この予定を削除しますか？')) return;
    const t = currentTrip();
    t.items = t.items.filter(x => x.id !== id);
    save(); ui.modal = null; ui.draft = null; render();
  },
  'add-member': () => addMember(),
  'remove-member': el => {
    ui.tripDraft.members = ui.tripDraft.members.filter(m => m.id !== el.dataset.id);
    renderModal();
  },
  'set-picky': el => { const on = el.dataset.val === 'picky'; if (ui.draft.picky !== on){ togglePicky(on); renderModal(); } },
  'set-icon': el => { const v = el.dataset.val; ui.draft.icon = ui.draft.icon === v ? '' : v; renderModal(); },
  'open-settle': () => { ui.modal = { type:'settle' }; renderModal(); },
  'cal-overlay': (el, e) => { if (e.target === el) handlers['cal-close'](); },
  'cal-close': () => { ui.cal = null; renderModal(); },
  'open-cal': el => {
    const t = el.dataset.target;
    if (ui.cal === t){ ui.cal = null; renderModal(); return; }
    ui.cal = t;
    ui.calMonth = (t === 'start' ? ui.tripDraft.start : ui.tripDraft.end).slice(0,7);
    renderModal();
  },
  'cal-move': el => {
    const [y,m] = ui.calMonth.split('-').map(Number);
    ui.calMonth = toStr(new Date(y, m-1+Number(el.dataset.delta), 1)).slice(0,7);
    renderModal();
  },
  'cal-pick': el => {
    const date = el.dataset.date; const d = ui.tripDraft;
    if (ui.cal === 'start'){
      d.start = date;
      if (d.end < date) d.end = date;
      ui.cal = 'end'; ui.calMonth = d.end.slice(0,7);
    } else {
      if (date < d.start) d.start = date; else d.end = date;
      ui.cal = null;
    }
    renderModal();
  },
  'save-trip': () => saveTrip()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = handlers[el.dataset.action];
  if (fn) fn(el, e);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newMember'){
    e.preventDefault(); addMember();
  }
});

function bindField(el){
  if (el.dataset.draft && ui.draft) ui.draft[el.dataset.draft] = el.value;
  if (el.dataset.tdraft && ui.tripDraft) ui.tripDraft[el.dataset.tdraft] = el.value;
  if (el.dataset.custom && ui.draft){
    ui.draft.custom[el.dataset.custom] = el.value;
    const s = document.getElementById('sumv');
    if (s) s.textContent = yen(sumCustom());
  }
}
document.addEventListener('input', e => { bindField(e.target); autoSave(); });

document.addEventListener('change', async e => {
  const el = e.target;
  bindField(el);
  autoSave();

  if (el.dataset.file === 'thumb' && el.files[0]){
    ui.draft.thumb = await compressImage(el.files[0]);
    renderModal();
  }
  if (el.dataset.file === 'tthumb' && el.files[0]){
    ui.tripDraft.thumb = await compressImage(el.files[0]);
    renderModal();
  }
  if (el.dataset.toggle === 'cost'){
    ui.draft.hasCost = el.checked;
    if (el.checked && !ui.draft.payerId) ui.draft.payerId = currentTrip().members[0]?.id || '';
    renderModal();
  }
  if (el.dataset.toggle === 'picky'){
    togglePicky(el.checked);
    renderModal();
  }
  if (el.dataset.target){
    const id = el.dataset.target; const d = ui.draft;
    d.targets = el.checked ? [...d.targets, id] : d.targets.filter(x => x !== id);
    renderModal();
  }
});

render();
</script>
